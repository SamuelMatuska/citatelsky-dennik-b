# Lokálny vývoj: `docker compose up --build` → http://localhost:8000
# Súbor .env je nepovinný. Bez neho sa použijú vývojové hodnoty nižšie
# (databáza nie je vystavená mimo Docker siete).
name: citatelsky-dennik-b

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-citatelsky}
      MARIADB_USER: ${DB_USERNAME:-citatelsky}
      MARIADB_PASSWORD: ${DB_PASSWORD:-citatelsky-dev}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-citatelsky}
      DB_USERNAME: ${DB_USERNAME:-citatelsky}
      DB_PASSWORD: ${DB_PASSWORD:-citatelsky-dev}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
